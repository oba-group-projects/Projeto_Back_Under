name: Jest Tests & Release

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint:
    name: Lint (Node 20.x)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Make Husky hooks executable
        run: chmod +x .husky/pre-commit .husky/commit-msg

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

  test:
    name: Run Jest Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Jest tests
        run: npm run test:jest

      - name: Generate coverage report
        # Roda apenas se os testes passaram; o job falha corretamente se não passarem.
        if: success()
        run: npm run test:coverage

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: jest
          fail_ci_if_error: false

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [lint, test]

    # Roda apenas em pushes diretos para main (nunca em PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write # Criar tags, commits de release e GitHub Releases
      issues: write # Comentar em issues resolvidas pelo release
      pull-requests: write # Comentar em PRs incluídos no release

    steps:
      - name: Checkout repository (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Obrigatório: semantic-release precisa de todo o histórico git
          persist-credentials: false

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
