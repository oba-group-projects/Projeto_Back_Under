<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRECIFICAÇÃO JUSTA BACK AO UNDER | Cockpit de Trading Multi-Jogos</title>
  <meta name="description" content="Terminal de alta visibilidade e velocidade para Precificação Justa Back ao Under com motor minuto a minuto, sincronização de TV e escada Betfair.">
  
  <!-- Estilos da Aplicação -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/grid.css">
</head>
<body>

  <!-- Topo da Aplicação (Header Sticky Limpo & Focado) -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-wrapper">
        <div class="brand-icon">⚽</div>
        <div>
          <div style="display: flex; align-items: center; gap: 0.4rem;">
            <span class="brand-title">PRECIFICAÇÃO JUSTA BACK AO UNDER</span>
            <span class="brand-badge">PRO COCKPIT</span>
          </div>
        </div>
      </div>

      <!-- Controles de Layout (1, 2, 3 ou 4 Jogos) e Usuário -->
      <div class="header-controls">
        
        <!-- Seletores de Layout -->
        <div class="view-toggle-group">
          <button class="view-toggle-btn active" data-view="view-4" title="Visualizar 4 Jogos (2x2)">4 Jogos</button>
          <button class="view-toggle-btn" data-view="view-3" title="Visualizar 3 Jogos">3 Jogos</button>
          <button class="view-toggle-btn" data-view="view-2" title="Visualizar 2 Jogos (Um abaixo do outro)">2 Jogos</button>
          <button class="view-toggle-btn" data-view="view-1" title="Foco em 1 Jogo Único Centralizado">1 Jogo</button>
        </div>

        <!-- Seletor de Estilo de Fonte / Tipografia -->
        <div class="font-selector-group" title="Selecione o estilo da letra">
          <span style="font-size: 0.68rem; color: #94a3b8; font-weight: 800;">🔤</span>
          <select id="fontThemeSelect" class="font-theme-dropdown">
            <option value="calibri" selected>Calibri Pro (Padrão)</option>
            <option value="outfit">Outfit (Moderna)</option>
            <option value="jakarta">Plus Jakarta (Tech)</option>
            <option value="rajdhani">Rajdhani (Cockpit HUD)</option>
            <option value="inter">Inter (Clássica)</option>
          </select>
        </div>

        <!-- Área de Autenticação / Perfil -->
        <div id="userHeaderArea" style="display: flex; align-items: center; gap: 0.4rem;">
          <div id="userProfileBadge" class="user-profile-badge">
            <span id="userRoleIcon">👤</span>
            <span id="userNameDisplay">Trader</span>
          </div>

          <!-- Botão Painel Admin (Visível apenas para Administrador) -->
          <button id="adminDashboardBtn" class="btn btn-admin btn-sm" style="display: none;" title="Abrir Painel de Controle Master">
            👑 Painel Admin
          </button>

          <!-- Botão Logout -->
          <button id="logoutBtn" class="btn btn-secondary btn-sm" title="Encerrar Sessão">
            🚪 Sair
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- Conteúdo Principal: Cockpit Grid Multi-Jogos Centralizado -->
  <main class="app-main" style="padding: 0.75rem;">

    <!-- Grid Multi-Jogos (Suporte a 1, 2, 3 ou 4 jogos) -->
    <section id="gamesGrid" class="games-grid view-4">
      <!-- Slot 1 -->
      <div id="slotCard1" class="game-card"></div>
      <!-- Slot 2 -->
      <div id="slotCard2" class="game-card"></div>
      <!-- Slot 3 -->
      <div id="slotCard3" class="game-card"></div>
      <!-- Slot 4 -->
      <div id="slotCard4" class="game-card"></div>
    </section>

  </main>

  <!-- Scripts da Aplicação (Módulos ES6) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
